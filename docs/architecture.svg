<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Shift Readiness Agent — architecture</title>
  <desc>A line manager watches a shift board. FastAPI serves it. A replay clock advances "now"; deterministic Python projects arrivals, queue headcount and Erlang C service level, and opens a priced alert. Only then does a Google ADK agent write the prose, behind a tool boundary that hands over finished numbers and rejects any figure it did not compute. Postgres holds everything.</desc>

  <defs>
    <style>
      .t     { fill: #0f172a; }
      .mu    { fill: #64748b; }
      .lbl   { fill: #475569; }
      .box   { rx: 8; stroke-width: 1.5; }
      .clu   { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .det   { fill: #a7f3d0; stroke: #047857; }
      .detx  { fill: #ecfdf5; stroke: #047857; stroke-dasharray: 6 4; }
      .ui    { fill: #dbeafe; stroke: #1d4ed8; }
      .api   { fill: #bfdbfe; stroke: #1d4ed8; }
      .llm   { fill: #ddd6fe; stroke: #6d28d9; }
      .grd   { fill: #fef9c3; stroke: #a16207; }
      .dat   { fill: #fed7aa; stroke: #c2410c; }
      .per   { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .div   { stroke: #94a3b8; stroke-width: 1; opacity: .55; }
      .e     { fill: none; stroke: #64748b; stroke-width: 1.8; }
      .ed    { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .mono  { font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
      text   { dominant-baseline: auto; }
    </style>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ══ title and legend ══ -->
  <text x="40" y="44" class="t" font-size="29" font-weight="700">Shift Readiness Agent<tspan class="mu" font-weight="400"> — architecture</tspan></text>
  <text x="40" y="70" class="mu" font-size="13.5">Green is arithmetic. Purple is the model. The manager only ever sees the board on the left.</text>

  <rect x="1128" y="26" width="13" height="13" class="box det"/>
  <text x="1149" y="37" class="t" font-size="12">Deterministic Python</text>
  <rect x="1128" y="50" width="13" height="13" class="box llm"/>
  <text x="1149" y="61" class="t" font-size="12">Model (ADK · LiteLLM)</text>
  <rect x="1330" y="26" width="13" height="13" class="box grd"/>
  <text x="1351" y="37" class="t" font-size="12">Guardrail</text>
  <rect x="1330" y="50" width="13" height="13" class="box dat"/>
  <text x="1351" y="61" class="t" font-size="12">Data</text>

  <!-- ══ clusters ══ -->
  <rect x="498" y="100" width="274" height="600" class="clu" rx="10"/>
  <text x="514" y="126" font-size="13.5" font-weight="700" fill="#334155">1 · Sense</text>

  <rect x="790" y="100" width="310" height="600" class="clu" rx="10"/>
  <text x="804" y="126" font-size="13.5" font-weight="700" fill="#334155">2 · Reason</text>
  <text x="804" y="144" class="mu" font-size="10.5">deterministic Python · ~15 ms a tick</text>
  <text x="804" y="159" class="mu" font-size="10.5">no model calls, no per-tick round trips</text>

  <rect x="1118" y="100" width="442" height="600" class="clu" rx="10"/>
  <text x="1132" y="126" font-size="13.5" font-weight="700" fill="#334155">3 · Act</text>
  <text x="1132" y="144" class="mu" font-size="10.5">Google ADK · an OpenAI model through LiteLLM</text>
  <text x="1132" y="159" class="mu" font-size="10.5">only when the situation changes</text>

  <!-- ══ the manager and the board ══ -->
  <rect x="40" y="118" width="250" height="70" rx="35" class="per"/>
  <text x="165" y="148" class="t" font-size="15" font-weight="700" text-anchor="middle">Line manager</text>
  <text x="165" y="170" class="mu" font-size="12" font-style="italic" text-anchor="middle">is my floor staffed at nine?</text>

  <path d="M165,188 V218" class="e" marker-end="url(#h)"/>

  <rect x="40" y="218" width="250" height="190" class="box ui"/>
  <text x="165" y="250" class="t" font-size="16" font-weight="700" text-anchor="middle">Shift board</text>
  <text x="165" y="270" class="mu" font-size="11.5" text-anchor="middle">web/index.html — one file,</text>
  <text x="165" y="287" class="mu" font-size="11.5" text-anchor="middle">no build step</text>
  <line x1="64" y1="302" x2="266" y2="302" class="div"/>
  <text x="165" y="330" class="t" font-size="12" text-anchor="middle">queues · riders · alerts</text>
  <text x="165" y="349" class="t" font-size="12" text-anchor="middle">options as buttons</text>
  <text x="165" y="368" class="t" font-size="12" text-anchor="middle">sent log · chat</text>
  <text x="165" y="387" class="t" font-size="12" text-anchor="middle">story slider</text>

  <text x="165" y="432" class="mu" font-size="12" font-style="italic" text-anchor="middle">everything the manager sees</text>

  <!-- ══ the claims worth defending ══ -->
  <rect x="40" y="480" width="250" height="228" class="clu" rx="8"/>
  <text x="56" y="508" class="t" font-size="13" font-weight="700">Why it holds up</text>
  <line x1="56" y1="520" x2="274" y2="520" class="div"/>
  <text x="56" y="544" class="t" font-size="11.5">The reasoning core makes no model</text>
  <text x="56" y="560" class="t" font-size="11.5">calls and no per-tick database</text>
  <text x="56" y="576" class="t" font-size="11.5">round trips — about 15 ms a tick.</text>
  <text x="56" y="604" class="t" font-size="11.5">The model writes only when an alert</text>
  <text x="56" y="620" class="t" font-size="11.5">opens, resolves, changes cause or</text>
  <text x="56" y="636" class="t" font-size="11.5">crosses a severity band: about 11</text>
  <text x="56" y="652" class="t" font-size="11.5">write-ups across the morning.</text>
  <text x="56" y="680" class="t" font-size="11.5">112 tests pass without ever</text>
  <text x="56" y="696" class="t" font-size="11.5">reaching the model.</text>

  <!-- ══ api ══ -->
  <rect x="320" y="160" width="150" height="350" class="box api"/>
  <text x="395" y="196" class="t" font-size="17" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="395" y="216" class="mu" font-size="11.5" text-anchor="middle">app/api.py</text>
  <line x1="340" y1="232" x2="450" y2="232" class="div"/>
  <text x="395" y="256" class="t" font-size="12" text-anchor="middle">every request</text>
  <text x="395" y="274" class="t" font-size="12" text-anchor="middle">is scoped by</text>
  <text x="395" y="300" class="t" font-size="12" font-weight="600" text-anchor="middle">business unit</text>
  <text x="395" y="318" class="t" font-size="12" font-weight="600" text-anchor="middle">office · date</text>
  <text x="395" y="336" class="t" font-size="12" font-weight="600" text-anchor="middle">shift</text>
  <line x1="340" y1="354" x2="450" y2="354" class="div"/>
  <text x="395" y="378" class="t" font-size="11.5" text-anchor="middle">board · alerts</text>
  <text x="395" y="396" class="t" font-size="11.5" text-anchor="middle">event feed</text>
  <text x="395" y="414" class="t" font-size="11.5" text-anchor="middle">act · chat</text>
  <text x="395" y="432" class="t" font-size="11.5" text-anchor="middle">story slider</text>
  <line x1="340" y1="450" x2="450" y2="450" class="div"/>
  <text x="395" y="474" class="mu" font-size="11.5" text-anchor="middle">REST + SSE</text>

  <path d="M290,300 H320" class="e" marker-start="url(#h)" marker-end="url(#h)"/>

  <!-- ══ 1 · sense ══ -->
  <rect x="514" y="142" width="242" height="100" class="box detx"/>
  <text x="635" y="170" class="t" font-size="13" font-weight="700" text-anchor="middle">Production seam</text>
  <text x="635" y="192" class="t" font-size="11.5" text-anchor="middle">swap the replay for a live</text>
  <text x="635" y="208" class="t" font-size="11.5" text-anchor="middle">trip-event feed and nothing</text>
  <text x="635" y="224" class="t" font-size="11.5" text-anchor="middle">downstream changes</text>

  <path d="M635,242 V300" class="ed" marker-end="url(#h)"/>

  <rect x="514" y="300" width="242" height="212" class="box det"/>
  <text x="635" y="334" class="t" font-size="16" font-weight="700" text-anchor="middle">Replay clock</text>
  <text x="635" y="354" class="mu" font-size="11.5" text-anchor="middle">app/replay.py</text>
  <line x1="538" y1="370" x2="732" y2="370" class="div"/>
  <text x="635" y="396" class="t" font-size="12" text-anchor="middle">advances now and emits</text>
  <text x="635" y="414" class="t" font-size="12" text-anchor="middle">the event feed</text>
  <text x="635" y="440" class="t" font-size="12" text-anchor="middle">every read is guarded,</text>
  <text x="635" y="458" class="t" font-size="12" text-anchor="middle">so nothing is visible</text>
  <text x="635" y="476" class="t" font-size="12" text-anchor="middle">before it happened</text>

  <path d="M470,405 H514" class="e" marker-start="url(#h)" marker-end="url(#h)"/>
  <path d="M756,350 H781 V208 H808" class="e" marker-end="url(#h)"/>

  <!-- ══ 2 · reason ══ -->
  <rect x="808" y="172" width="274" height="72" class="box det"/>
  <text x="945" y="198" class="t" font-size="13.5" font-weight="700" text-anchor="middle">state.py</text>
  <text x="945" y="217" class="t" font-size="11" text-anchor="middle">nine-state rider machine, reading</text>
  <text x="945" y="233" class="t" font-size="11" text-anchor="middle">only what now reveals</text>

  <path d="M945,244 V260" class="e" marker-end="url(#h)"/>

  <rect x="808" y="260" width="274" height="72" class="box det"/>
  <text x="945" y="286" class="t" font-size="13.5" font-weight="700" text-anchor="middle">eta.py</text>
  <text x="945" y="305" class="t" font-size="11" text-anchor="middle">arrival projection with an</text>
  <text x="945" y="321" class="t" font-size="11" text-anchor="middle">honest uncertainty band</text>

  <path d="M945,332 V348" class="e" marker-end="url(#h)"/>

  <rect x="808" y="348" width="274" height="72" class="box det"/>
  <text x="945" y="374" class="t" font-size="13.5" font-weight="700" text-anchor="middle">queue.py</text>
  <text x="945" y="393" class="t" font-size="11" text-anchor="middle">headcount per queue,</text>
  <text x="945" y="409" class="t" font-size="11" text-anchor="middle">impact as a range</text>

  <path d="M945,420 V436" class="e" marker-end="url(#h)"/>

  <rect x="808" y="436" width="274" height="72" class="box det"/>
  <text x="945" y="462" class="t" font-size="13.5" font-weight="700" text-anchor="middle">sla.py</text>
  <text x="945" y="481" class="t" font-size="11" text-anchor="middle">Erlang C service level, speed</text>
  <text x="945" y="497" class="t" font-size="11" text-anchor="middle">of answer, day rollup</text>

  <path d="M945,508 V524" class="e" marker-end="url(#h)"/>

  <rect x="808" y="524" width="274" height="72" class="box det"/>
  <text x="945" y="550" class="t" font-size="13" font-weight="700" text-anchor="middle">context.py · remediation.py</text>
  <text x="945" y="569" class="t" font-size="11" text-anchor="middle">five benchmarks · cover verified</text>
  <text x="945" y="585" class="t" font-size="11" text-anchor="middle">on the floor · hold-over priced</text>

  <path d="M945,596 V612" class="e" marker-end="url(#h)"/>

  <rect x="808" y="612" width="274" height="72" class="box det"/>
  <text x="945" y="638" class="t" font-size="13.5" font-weight="700" text-anchor="middle">alerts.py</text>
  <text x="945" y="657" class="t" font-size="11" text-anchor="middle">trigger · cause · lifecycle, hysteresis</text>
  <text x="945" y="673" class="t" font-size="11" text-anchor="middle">options scored on the contract</text>

  <!-- ══ 3 · act ══ -->
  <path d="M1082,648 H1136" class="e" marker-end="url(#h)"/>

  <rect x="1136" y="172" width="180" height="512" class="box grd"/>
  <text x="1226" y="204" class="t" font-size="13.5" font-weight="700" text-anchor="middle">agent/tools.py</text>
  <text x="1226" y="222" class="t" font-size="11.5" font-style="italic" text-anchor="middle">the boundary</text>
  <line x1="1156" y1="240" x2="1296" y2="240" class="div"/>
  <text x="1226" y="266" class="t" font-size="11.5" text-anchor="middle">hands over finished</text>
  <text x="1226" y="283" class="t" font-size="11.5" text-anchor="middle">numbers, takes</text>
  <text x="1226" y="300" class="t" font-size="11.5" text-anchor="middle">back sentences</text>
  <line x1="1156" y1="320" x2="1296" y2="320" class="div"/>
  <text x="1226" y="346" class="t" font-size="12" font-weight="600" text-anchor="middle">7 tools</text>
  <text x="1226" y="366" class="t" font-size="11.5" text-anchor="middle">scope is not a</text>
  <text x="1226" y="383" class="t" font-size="11.5" text-anchor="middle">parameter the</text>
  <text x="1226" y="400" class="t" font-size="11.5" text-anchor="middle">model can set</text>
  <line x1="1156" y1="420" x2="1296" y2="420" class="div"/>
  <text x="1226" y="446" class="t" font-size="11.5" text-anchor="middle">every figure is</text>
  <text x="1226" y="463" class="t" font-size="11.5" text-anchor="middle">checked against</text>
  <text x="1226" y="480" class="t" font-size="11.5" text-anchor="middle">the payload; an</text>
  <text x="1226" y="497" class="t" font-size="11.5" text-anchor="middle">invented one is</text>
  <text x="1226" y="514" class="t" font-size="11.5" text-anchor="middle">rejected and the</text>
  <text x="1226" y="531" class="t" font-size="11.5" text-anchor="middle">model told to</text>
  <text x="1226" y="548" class="t" font-size="11.5" text-anchor="middle">rewrite</text>
  <text x="1226" y="572" class="mono mu" font-size="10.5" text-anchor="middle">_ungrounded_figures()</text>
  <line x1="1156" y1="592" x2="1296" y2="592" class="div"/>
  <text x="1226" y="618" class="mu" font-size="11" font-style="italic" text-anchor="middle">errors return as</text>
  <text x="1226" y="634" class="mu" font-size="11" font-style="italic" text-anchor="middle">data, not exceptions,</text>
  <text x="1226" y="650" class="mu" font-size="11" font-style="italic" text-anchor="middle">so a bad turn is</text>
  <text x="1226" y="666" class="mu" font-size="11" font-style="italic" text-anchor="middle">recoverable</text>

  <rect x="1340" y="200" width="200" height="200" class="box llm"/>
  <text x="1440" y="232" class="t" font-size="14" font-weight="700" text-anchor="middle">narrator_agent</text>
  <text x="1440" y="251" class="mu" font-size="11.5" text-anchor="middle">2 tools</text>
  <line x1="1360" y1="268" x2="1520" y2="268" class="div"/>
  <text x="1440" y="294" class="t" font-size="11.5" text-anchor="middle">writes the summary</text>
  <text x="1440" y="311" class="t" font-size="11.5" text-anchor="middle">and the drafts the</text>
  <text x="1440" y="328" class="t" font-size="11.5" text-anchor="middle">manager forwards</text>
  <text x="1440" y="345" class="t" font-size="11.5" text-anchor="middle">unedited</text>
  <text x="1440" y="370" class="mu" font-size="11" font-style="italic" text-anchor="middle">about 11 across a</text>
  <text x="1440" y="385" class="mu" font-size="11" font-style="italic" text-anchor="middle">150-tick morning</text>

  <rect x="1340" y="440" width="200" height="200" class="box llm"/>
  <text x="1440" y="472" class="t" font-size="14" font-weight="700" text-anchor="middle">root_agent</text>
  <text x="1440" y="491" class="mu" font-size="11.5" text-anchor="middle">7 tools</text>
  <line x1="1360" y1="508" x2="1520" y2="508" class="div"/>
  <text x="1440" y="534" class="t" font-size="11.5" text-anchor="middle">answers the</text>
  <text x="1440" y="551" class="t" font-size="11.5" text-anchor="middle">manager's questions</text>
  <text x="1440" y="568" class="t" font-size="11.5" text-anchor="middle">about the shift</text>
  <text x="1440" y="593" class="mu" font-size="11" font-style="italic" text-anchor="middle">streams tokens</text>
  <text x="1440" y="608" class="mu" font-size="11" font-style="italic" text-anchor="middle">over SSE</text>

  <path d="M1316,300 H1340" class="e" marker-start="url(#h)" marker-end="url(#h)"/>
  <path d="M1316,540 H1340" class="e" marker-start="url(#h)" marker-end="url(#h)"/>

  <!-- ══ the chat round trip ══ -->
  <path d="M395,510 V726 H1390 V640" class="e" marker-start="url(#h)" marker-end="url(#h)"/>
  <text x="1170" y="718" class="lbl" font-size="11" text-anchor="middle">the manager's question in, the prose back</text>

  <!-- ══ data ══ -->
  <path d="M498,772 V868 A531,16 0 0 0 1560,868 V772" class="dat" stroke-width="1.5"/>
  <ellipse cx="1029" cy="772" rx="531" ry="16" class="dat" stroke-width="1.5"/>
  <text x="1029" y="804" class="t" font-size="17" font-weight="700" text-anchor="middle">Postgres</text>
  <text x="1029" y="827" class="t" font-size="11.5" text-anchor="middle">trips · rider_legs · trip_alerts · queues · roster · shift_alerts · alert_actions · cover_log · narrative_cache</text>
  <text x="1029" y="844" class="t" font-size="11.5" text-anchor="middle">four views carry the history maths · the ADK agent's conversation history lives in the same database</text>
  <text x="1029" y="861" class="t" font-size="11" font-style="italic" text-anchor="middle">every table keyed by business unit and office, so pointing this at another tenant is a config change</text>

  <rect x="40" y="768" width="250" height="104" class="box dat"/>
  <text x="165" y="796" class="t" font-size="13.5" font-weight="700" text-anchor="middle">MoveInSync trip logs</text>
  <text x="165" y="814" class="t" font-size="11.5" text-anchor="middle">anonymised dataset</text>
  <text x="165" y="836" class="t" font-size="12" text-anchor="middle">5 CSVs · 2.3M rows</text>
  <text x="165" y="856" class="t" font-size="11" text-anchor="middle">loaded by db/load.py · COPY</text>

  <path d="M290,820 H498" class="e" marker-end="url(#h)"/>
  <text x="394" y="810" class="lbl" font-size="10.5" text-anchor="middle">every quirk handled and counted</text>

  <path d="M635,756 V512" class="e" marker-end="url(#h)"/>
  <text transform="translate(620,610) rotate(-90)" class="lbl" font-size="11" text-anchor="middle">roster · only what now reveals</text>

  <path d="M945,684 V756" class="e" marker-end="url(#h)"/>

  <path d="M1440,640 V756" class="e" marker-start="url(#h)" marker-end="url(#h)"/>
  <text transform="translate(1452,698) rotate(-90)" class="lbl" font-size="11" text-anchor="middle">sessions · memo</text>
</svg>
