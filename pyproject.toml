[project]
name = "bessemer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk[db]>=2.8.0",
    "httpx>=0.28.1",
    "litellm>=1.99.0",
    "psycopg[binary,pool]>=3.3.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
load = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the real model and costs money"]
